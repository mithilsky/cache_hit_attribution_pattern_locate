[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mithilsky-cache_hit_attribution_pattern_locate"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告推荐系统算法工程师·缓存命中率的归因相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mithilsky" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mithilsky.github.io"
Repository = "https://github.com/mithilsky/cache_hit_attribution_pattern_locate"
Issues = "https://github.com/mithilsky/cache_hit_attribution_pattern_locate/issues"

[project.scripts]
cache_hit_attribution_pattern_locate = "cache_hit_attribution_pattern_locate:main"

[tool.setuptools]
py-modules = ["cache_hit_attribution_pattern_locate"]
